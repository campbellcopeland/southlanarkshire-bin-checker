<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bin Collection Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-button:hover {
            background: #f5f5f5;
            transform: translateX(-5px);
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .header p {
            color: #666;
            margin-bottom: 5px;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #c33;
            margin: 20px 0;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .schedule-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            border-top: 5px solid #667eea;
        }

        .schedule-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .bin-type {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bin-description {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .bin-schedule {
            font-size: 1.1em;
            color: #667eea;
            font-weight: 600;
        }

        .color-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #f5f5f5;
            color: #333;
            border-radius: 20px;
            margin: 5px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .info-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .info-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .info-label {
            color: #999;
            font-size: 0.85em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            color: #333;
            font-size: 1.2em;
            font-weight: 600;
        }

        .collection-days {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .day-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: 600;
        }

        .this-week-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .bin-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            border-top: 4px solid #667eea;
        }

        .bin-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .bin-image {
            margin-bottom: 15px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bin-image img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .bin-info {
            text-align: center;
        }

        .bin-type {
            font-size: 0.95em;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .bin-status {
            font-size: 0.9em;
            color: #667eea;
            font-weight: 600;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3c3;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .schedule-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-button">← Back to Home</a>

        <div class="header" th:if="${binData.success}">
            <h1>✅ Bin Collection Schedule</h1>
            <h2 style="color: #667eea; margin-bottom: 15px; font-size: 1.3em;" 
                th:if="${binData.location != null && binData.location.get('fullLocation') != null}">
                <span th:text="${binData.location.get('fullLocation')}"></span>
            </h2>
            <p th:text="${binData.pageTitle}"></p>
            <p style="color: #999; font-size: 0.9em; margin-top: 10px;">
                <strong>URL:</strong> <span th:text="${#strings.abbreviate(url, 60)}"></span>
            </p>
        </div>

        <div class="header" th:unless="${binData.success}">
            <h1>❌ Error</h1>
            <div class="error-message" th:text="${binData.error}"></div>
        </div>

        <!-- This Week's Collection (Highlighted) -->
        <div th:if="${binData.success && binData.thisWeekCollections != null && binData.thisWeekCollections.size() > 0}" class="info-section">
            <h2>🎯 THIS WEEK'S COLLECTION</h2>
            <div class="this-week-grid">
                <div th:each="collection : ${binData.thisWeekCollections}" class="bin-card">
                    <!-- Bin Image -->
                    <div class="bin-image">
                        <img th:if="${collection.get('color')} == 'blue'" src="/images/blue-bin.svg" alt="Blue Bin"/>
                        <img th:if="${collection.get('color')} == 'burgundy'" src="/images/burgundy-bin.svg" alt="Burgundy Bin"/>
                        <img th:if="${collection.get('color')} == 'light'" src="/images/grey-bin.svg" alt="Light Grey Bin"/>
                        <img th:if="${collection.get('color')} == 'black' or ${collection.get('color')} == 'green'" src="/images/black-bin.svg" alt="Black Bin"/>
                    </div>
                    <!-- Bin Info -->
                    <div class="bin-info">
                        <div class="bin-type" th:text="${collection.get('description')}"></div>
                        <div class="bin-status">✓ <span th:text="${collection.get('schedule')}"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Collection Days -->
        <div th:if="${binData.success && binData.collectionDays != null && binData.collectionDays.size() > 0}" class="info-section">
            <h2>📆 Collection Days</h2>
            <div class="collection-days">
                <span th:each="day : ${binData.collectionDays}" class="day-badge" th:text="${day}"></span>
            </div>
        </div>

    </div>
</body>
</html>
