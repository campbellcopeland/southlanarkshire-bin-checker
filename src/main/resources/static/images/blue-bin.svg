<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
  <!-- Blue bin for paper and card -->
  <rect x="30" y="50" width="140" height="120" fill="#1e5ba8" stroke="#000" stroke-width="2"/>
  <rect x="35" y="55" width="130" height="110" fill="#2a7bc4"/>
  <!-- Lid -->
  <rect x="20" y="40" width="160" height="20" fill="#1a4a8a" stroke="#000" stroke-width="2"/>
  <circle cx="60" cy="50" r="4" fill="#666"/>
  <circle cx="140" cy="50" r="4" fill="#666"/>
  <!-- Wheels -->
  <circle cx="50" cy="180" r="12" fill="#333" stroke="#000" stroke-width="1"/>
  <circle cx="150" cy="180" r="12" fill="#333" stroke="#000" stroke-width="1"/>
  <!-- Label -->
  <text x="100" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="white">BLUE</text>
  <text x="100" y="155" font-size="10" text-anchor="middle" fill="white">Paper &amp; Card</text>
</svg>
